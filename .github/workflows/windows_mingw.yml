name: Windows MinGW build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "main" ]
    
env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-mingw:

    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          make
          git
    - uses: actions/checkout@v3
    - run: git submodule update --init --recursive
    - name: Install Rust nightly toolchain (GNU)
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: x86_64-pc-windows-gnu
    - name: Make rustup/cargo available in MSYS2 shell
      run: |
        # Typical rustup locations on GitHub Windows runners
        for d in "$USERPROFILE/.cargo/bin" "$USERPROFILE/AppData/Local/Cargo/bin" ; do
          if [ -d "$d" ]; then
            # Convert Windows path to MSYS path and export it
            msysd="$(cygpath -u "$d")"
            echo "Adding to PATH: $msysd"
            export PATH="$msysd:$PATH"
            echo "$msysd" >> "$GITHUB_PATH"
          fi
        done

        command -v rustup || true
        command -v cargo || true
        cargo --version
        rustc --version
    - name: Configure environment
      run: |
        echo "CC=gcc" >> $GITHUB_ENV
        echo "CXX=g++" >> $GITHUB_ENV
    - name: Build
      run: cargo build --target x86_64-pc-windows-gnu --verbose
    - name: Run tests
      run: cargo test --target x86_64-pc-windows-gnu --verbose 
