[workspace]
resolver="2"
members = [
	"hxcfe-sys",
	"hxcfe"
, "hxcfe_cli"]

[workspace.dependencies]

hxcfe-sys = { version="0.2" }
hxcfe = { version="0.2" }

make-cmd = "0.1.0"
dunce = "1.0.5"
bindgen = "0.75"
copy_dir = "0.1.3"

[patch.crates-io]

hxcfe-sys = { path = "hxcfe-sys" }
hxcfe = { path = "hxcfe" }
